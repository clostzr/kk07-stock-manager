<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Warehouse Stock Manager</title>
  <style>
    /* Cyberpunk high-contrast theme */
    :root{
      --bg:#0b0b12; /* near-black */
      --panel:#0f0f18;
      --muted:#9aa0b4;
      --accent:#00fff6; /* neon cyan */
      --accent-2:#ff2d95; /* neon magenta */
      --glass: rgba(255,255,255,0.03);
      --danger:#ff5d5d;
      --success:#7effa1;
      --border: #ffffff; /* HIGH-CONTRAST: white borders */
      --glass-border: #ffffff; /* HIGH-CONTRAST: white borders */
    }
    html,body{height:100%}
    body{
      background: radial-gradient(1200px 600px at 10% 10%, rgba(0,45,60,0.12), transparent),
                  radial-gradient(800px 400px at 90% 90%, rgba(255,45,149,0.06), transparent),
                  var(--bg);
      color:#dfe7fb;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, 'Helvetica Neue', Arial;
      max-width:1100px;margin:24px auto;padding:24px;border-radius:10px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
    }
    header{display:flex;gap:16px;align-items:center;margin-bottom:20px}
    h1{color:var(--accent);margin:0;font-weight:700;letter-spacing:0.6px}
    .small{font-size:0.9em;color:var(--muted)}

    .card{background:linear-gradient(180deg,var(--panel), rgba(255,255,255,0.02));padding:14px;border-radius:10px;border:1px solid var(--glass-border)}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

    input, select{background:transparent;border:1px solid var(--border);padding:8px;border-radius:8px;color:var(--muted);min-height:36px}
    input::placeholder{color:#5b6076}

    button{padding:8px 12px;border-radius:8px;border:1px solid var(--glass-border);background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);color:var(--accent);cursor:pointer}
    button.ghost{background:transparent;color:var(--muted);border:1px dashed var(--glass-border)}
    button.primary{background: linear-gradient(90deg,var(--accent),var(--accent-2)); color:#051018;border:none}

    table{width:100%;border-collapse:collapse;margin-top:12px;background:transparent;border-radius:8px;overflow:hidden}
    thead th{background:linear-gradient(90deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));color:var(--muted);font-size:0.95em;padding:10px;text-align:left;border-bottom:1px solid var(--glass-border)}
    tbody td{padding:10px;border-bottom:1px solid var(--glass-border);color:#e6eefc}

    .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:0.85em}
    .in{background:linear-gradient(90deg, rgba(126,255,161,0.12), rgba(0,255,246,0.06));color:var(--success);border:1px solid var(--border)}
    .out{background:linear-gradient(90deg, rgba(255,93,93,0.06), rgba(255,45,149,0.04));color:var(--danger);border:1px solid var(--border)}

    .btn-in{background:transparent;border:1px solid var(--border);color:var(--accent);padding:6px 8px;border-radius:6px;font-size:0.9em}
    .btn-out{background:transparent;border:1px solid var(--border);color:var(--accent-2);padding:6px 8px;border-radius:6px;font-size:0.9em}
    .btn-hist{background:transparent;border:1px dashed var(--border);color:var(--muted);padding:6px 8px;border-radius:6px;font-size:0.9em}
    .btn-edit{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 8px;border-radius:6px;font-size:0.9em}

    .form-row{display:flex;gap:8px;align-items:center;margin-top:8px}
    .history{max-height:320px;overflow:auto;border-radius:8px;padding:12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));border:1px solid var(--glass-border);margin-top:8px}

    /* Modal styles */
    .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal-overlay.active{display:flex}
    .modal-content{background:linear-gradient(180deg,var(--panel), rgba(255,255,255,0.02));border:1px solid var(--glass-border);border-radius:10px;padding:20px;max-width:500px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,0.7)}
    .modal-content h2{color:var(--accent);margin-top:0}
    .modal-form-row{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    .modal-form-row label{color:var(--muted);font-size:0.9em}
    .modal-form-row input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:#dfe7fb}
    .modal-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .modal-buttons button{padding:8px 16px}

    /* Floating history panel */
    #historyPanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(180deg,var(--panel), rgba(255,255,255,0.02));border:1px solid var(--glass-border);border-radius:10px;padding:18px;display:none;z-index:900;width:90%;max-width:780px;max-height:80vh;overflow:auto}
    #historyPanel.active{display:block}

    @media (max-width:720px){
      .form-row{flex-direction:column;align-items:stretch}
      .controls{flex-direction:column}
      thead{display:none}
      tbody td{display:block;width:100%}
      tbody tr{margin-bottom:12px;border-bottom:1px solid var(--glass-border)}
      #historyPanel{width:95%;max-height:70vh}
      .modal-content{width:95%}
    }
  </style>
</head>
<body>
  <header>
    <h1>Warehouse Stock Manager</h1>
    <div class="small">Real-time using Firebase Firestore — neon edition</div>
  </header>

  <section id="authSection" class="small card"></section>

  <section aria-labelledby="addItemTitle" class="card" style="margin-top:12px">
    <h2 id="addItemTitle">Create new item</h2>
    <div class="form-row" style="margin-top:10px">
      <input id="sku" placeholder="SKU (unique)" />
      <input id="name" placeholder="Item name" style="flex:1" />
      <input id="unit" placeholder="Unit (e.g. pcs, kg)" style="width:140px" />
      <input id="initialQty" type="number" placeholder="Initial qty" style="width:120px" />
      <button id="createItemBtn" class="primary">Create</button>
    </div>
    <div class="small" style="margin-top:8px">If SKU exists, it will not be overwritten.</div>
  </section>

  <section aria-labelledby="itemsTitle" class="card" style="margin-top:12px">
    <h2 id="itemsTitle">Items</h2>
    <div class="controls" style="margin-top:8px">
      <input id="search" placeholder="Search SKU or name" />
      <button id="refresh" class="ghost">Refresh</button>
      <button id="signInBtn" class="ghost">Sign in (Google)</button>
      <button id="signOutBtn" class="ghost" style="display:none">Sign out</button>
    </div>

    <table id="itemsTable" aria-live="polite">
      <thead><tr><th>SKU</th><th>Name</th><th>Balance</th><th>Unit</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="historyPanel" class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">History for <span id="historyTitle"></span></h3>
      <button id="closeHistory" class="ghost">✕</button>
    </div>
    <div id="history" class="history"></div>
  </section>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-content">
      <h2>Edit Item</h2>
      <div class="modal-form-row">
        <label>SKU</label>
        <input id="editSku" type="text" readonly style="opacity:0.6;cursor:not-allowed" />
      </div>
      <div class="modal-form-row">
        <label>Name</label>
        <input id="editName" type="text" />
      </div>
      <div class="modal-form-row">
        <label>Unit</label>
        <input id="editUnit" type="text" />
      </div>
      <div class="modal-form-row">
        <label>Current Balance</label>
        <input id="editBalance" type="number" />
      </div>
      <div class="modal-form-row">
        <label>Add to Balance (for adjustment)</label>
        <input id="editAdjustment" type="number" placeholder="Leave empty for no change" />
      </div>
      <div class="modal-buttons">
        <button id="modalCancel" class="ghost">Cancel</button>
        <button id="modalSave" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    // --- FIREBASE CONFIG: your project's config inserted here ---
    const firebaseConfig = {
      apiKey: "AIzaSyCc8wbwPHKFneX4OLKiFz5MT4VmChxFVa4",
      authDomain: "inventory-app-kk07.firebaseapp.com",
      projectId: "inventory-app-kk07",
      storageBucket: "inventory-app-kk07.firebasestorage.app",
      messagingSenderId: "756051255195",
      appId: "1:756051255195:web:3d024e2a661a12a7f44b3e",
      measurementId: "G-5YWWJ6821Y"
    };
    // --- end config ---

    // Firebase modular SDK v9+ via CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getFirestore, collection, doc, onSnapshot, setDoc, addDoc, getDoc,
      runTransaction, query, orderBy, serverTimestamp, where, getDocs, updateDoc
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
    import {
      getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    console.log('Firebase initialized for project:', firebaseConfig.projectId);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // UI refs
    const skuInput = document.getElementById('sku');
    const nameInput = document.getElementById('name');
    const unitInput = document.getElementById('unit');
    const initialQtyInput = document.getElementById('initialQty');
    const createBtn = document.getElementById('createItemBtn');
    const itemsTableBody = document.querySelector('#itemsTable tbody');
    const searchInput = document.getElementById('search');
    const refreshBtn = document.getElementById('refresh');
    const historyPanel = document.getElementById('historyPanel');
    const historyTitle = document.getElementById('historyTitle');
    const historyDiv = document.getElementById('history');
    const closeHistory = document.getElementById('closeHistory');
    const signInBtn = document.getElementById('signInBtn');
    const signOutBtn = document.getElementById('signOutBtn');
    const authSection = document.getElementById('authSection');
    
    // Edit modal refs
    const editModal = document.getElementById('editModal');
    const editSku = document.getElementById('editSku');
    const editName = document.getElementById('editName');
    const editUnit = document.getElementById('editUnit');
    const editBalance = document.getElementById('editBalance');
    const editAdjustment = document.getElementById('editAdjustment');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');

    let currentUser = null;
    let currentEditingItem = null;
    
    onAuthStateChanged(auth, user => {
      currentUser = user;
      console.log('onAuthStateChanged:', user);
      authSection.textContent = user ? `Signed in as ${user.displayName || user.email}` : 'Not signed in';
      signInBtn.style.display = user ? 'none' : '';
      signOutBtn.style.display = user ? '' : 'none';
    });

    signInBtn.addEventListener('click', async () => {
      try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        console.log('signInWithPopup result:', result.user && { uid: result.user.uid, email: result.user.email });
      } catch (err) {
        console.error('Error during sign-in:', err);
        alert('Sign-in error: ' + (err.message || err));
      }
    });
    signOutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
        console.log('Signed out');
      } catch (err) {
        console.error('Sign-out error', err);
      }
    });

    // Create item (only if SKU not exists)
    createBtn.addEventListener('click', async () => {
      const sku = skuInput.value.trim();
      const name = nameInput.value.trim();
      const unit = unitInput.value.trim();
      const initialQty = parseInt(initialQtyInput.value || '0', 10) || 0;
      if (!sku || !name) return alert('SKU and name required.');
      const docRef = doc(db, 'items', sku);
      const snap = await getDoc(docRef);
      if (snap.exists()) return alert('SKU already exists.');
      try {
        await setDoc(docRef, {
          sku,
          name,
          unit: unit || '',
          balance: initialQty,
          createdAt: serverTimestamp()
        });
        console.log('Created item', sku, { name, unit, initialQty });
        // add initial transaction if initialQty > 0
        if (initialQty !== 0) {
          const txRef = doc(collection(docRef, 'transactions'));
          await setDoc(txRef, {
            quantity: initialQty,
            type: initialQty > 0 ? 'in' : 'out',
            note: 'Initial stock',
            createdAt: serverTimestamp(),
            user: currentUser ? currentUser.uid : null
          });
          console.log('Created initial transaction for', sku, 'qty=', initialQty);
        }
        skuInput.value = nameInput.value = unitInput.value = initialQtyInput.value = '';
      } catch (err) {
        console.error('Error creating item', err);
        alert('Error creating item: ' + (err.message || err));
      }
    });

    // Realtime items list
    const itemsCol = collection(db, 'items');
    const itemsQ = query(itemsCol, orderBy('sku'));
    let unsubscribeItems = null;
    function subscribeItems() {
      if (unsubscribeItems) unsubscribeItems();
      unsubscribeItems = onSnapshot(itemsQ, snapshot => {
        console.log('items onSnapshot size:', snapshot.size);
        renderItems(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
      }, err => {
        console.error('items onSnapshot error', err);
      });
    }
    subscribeItems();

    function renderItems(items) {
      const q = searchInput.value.trim().toLowerCase();
      itemsTableBody.innerHTML = '';
      items.filter(it => !q || it.sku.toLowerCase().includes(q) || (it.name || '').toLowerCase().includes(q))
           .forEach(it => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${it.sku}</td>
            <td>${escapeHtml(it.name||'')}</td>
            <td><strong>${(it.balance||0)}</strong></td>
            <td>${escapeHtml(it.unit||'')}</td>
            <td style="display:flex;gap:6px;flex-wrap:wrap">
              <button data-id="${it.id}" class="btn-in">+ IN</button>
              <button data-id="${it.id}" class="btn-out">- OUT</button>
              <button data-id="${it.id}" class="btn-hist">History</button>
              <button data-id="${it.id}" class="btn-edit">Edit</button>
            </td>`;
          itemsTableBody.appendChild(tr);
        });
    }

    // click handlers delegated
    itemsTableBody.addEventListener('click', async (e) => {
      const t = e.target;
      const id = t.dataset.id;
      if (!id) return;
      if (t.classList.contains('btn-in') || t.classList.contains('btn-out')) {
        const type = t.classList.contains('btn-in') ? 'in' : 'out';
        const qty = parseInt(prompt(`${type === 'in' ? 'Add' : 'Remove'} quantity:`,'1'),10);
        if (!qty || qty <= 0) return;
        const note = prompt('Optional note','');
        await changeStock(id, type === 'in' ? qty : -qty, type, note);
      } else if (t.classList.contains('btn-hist')) {
        openHistory(id);
      } else if (t.classList.contains('btn-edit')) {
        openEditModal(id);
      }
    });

    // changeStock uses a runTransaction to atomically update balance and add transaction doc
    async function changeStock(itemId, delta, type, note='') {
      const itemRef = doc(db, 'items', itemId);
      const txsCollection = collection(itemRef, 'transactions');
      console.log('changeStock start', { itemId, delta, type, user: currentUser && currentUser.uid });
      try {
        await runTransaction(db, async (transaction) => {
          const docSnap = await transaction.get(itemRef);
          if (!docSnap.exists()) throw new Error('Item not found');
          const current = docSnap.data().balance || 0;
          const newBal = current + delta;
          if (newBal < 0) throw new Error('Insufficient stock (would go negative)');
          transaction.update(itemRef, { balance: newBal });
          // create transaction doc inside the same transaction
          const newTxRef = doc(txsCollection);
          transaction.set(newTxRef, {
            quantity: delta,
            type,
            note: note || '',
            createdAt: serverTimestamp(),
            user: currentUser ? currentUser.uid : null
          });
        });
        console.log('changeStock success', { itemId, delta });
      } catch (err) {
        console.error('changeStock error', err);
        alert('Error: ' + (err.message || err));
      }
    }

    // show history (last 200 ordered desc)
    async function openHistory(itemId) {
      historyPanel.classList.add('active');
      historyTitle.textContent = itemId;
      historyDiv.innerHTML = 'Loading...';

      // fetch current balance and unit
      let currentBalance = null;
      let itemUnit = '';
      try {
        const itemSnap = await getDoc(doc(db, 'items', itemId));
        if (itemSnap.exists()) {
          const itemData = itemSnap.data();
          currentBalance = itemData.balance != null ? itemData.balance : null;
          itemUnit = itemData.unit || '';
        }
      } catch (err) {
        console.warn('Could not fetch item document for balance:', err);
      }

      const txsRef = collection(doc(db,'items',itemId), 'transactions');
      const q = query(txsRef, orderBy('createdAt', 'desc'));
      try {
        const snap = await getDocs(q);
        console.log('openHistory got tx count:', snap.size, 'for', itemId);
        if (snap.empty) {
          historyDiv.innerHTML = '<div class="small">No transactions</div>';
          return;
        }

        // Build list of transactions and collect user ids to resolve names
        const txs = snap.docs.slice(0,200).map(d => ({ id: d.id, ...d.data() }));
        const userIds = Array.from(new Set(txs.map(t => t.user).filter(Boolean)));
        const userNameMap = {};

        if (userIds.length) {
          // fetch user docs in parallel (if you store profiles under 'users' collection)
          await Promise.all(userIds.map(async uid => {
            try {
              const uSnap = await getDoc(doc(db, 'users', uid));
              if (uSnap.exists()) {
                const ud = uSnap.data();
                userNameMap[uid] = ud.displayName || ud.name || ud.email || uid;
              } else {
                userNameMap[uid] = uid; // fallback to uid
              }
            } catch (e) {
              userNameMap[uid] = uid;
            }
          }));
        }

        // Render header with current balance
        historyDiv.innerHTML = '';
        const header = document.createElement('div');
        header.style.marginBottom = '12px';
        header.innerHTML = `<div class="small">Current balance: <strong>${currentBalance != null ? escapeHtml(String(currentBalance)) : 'unknown'}</strong> ${escapeHtml(itemUnit)}</div>`;
        historyDiv.appendChild(header);

        // Render transactions in requested format: ins/out, timestamp, executor name, transaction details
        txs.forEach(data => {
          const when = data.createdAt ? (new Date(data.createdAt.seconds * 1000)).toLocaleString() : '';
          const qty = Number(data.quantity || 0);
          const typeLabel = qty > 0 ? 'IN' : (qty < 0 ? 'OUT' : (data.type || '').toUpperCase());
          const executor = data.user ? (userNameMap[data.user] || data.user) : 'unknown';

          const line = document.createElement('div');
          line.style.marginBottom = '10px';
          line.innerHTML = `
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <div style="min-width:80px"><span class=\"badge ${qty>0? 'in':'out'}\">${escapeHtml(typeLabel)}</span></div>
              <div style="min-width:180px;color:var(--muted)">${escapeHtml(when)}</div>
              <div style="min-width:160px;color:var(--muted)">${escapeHtml(executor)}</div>
              <div style="flex:1">${escapeHtml(String(data.note || ''))} <span class=\"small\">(${qty>0? '+'+qty: qty})</span></div>
            </div>`;
          historyDiv.appendChild(line);
        });

      } catch (err) {
        console.error('openHistory error', err);
        historyDiv.innerHTML = '<div class="small">Error loading history</div>';
      }
    }
    closeHistory.addEventListener('click', () => { historyPanel.classList.remove('active'); });

    // Edit modal handlers
    function openEditModal(itemId) {
      // Get current item data
      const itemsRef = collection(db, 'items');
      const docRef = doc(db, 'items', itemId);
      getDoc(docRef).then(docSnap => {
        if (docSnap.exists()) {
          currentEditingItem = itemId;
          const data = docSnap.data();
          editSku.value = data.sku || '';
          editName.value = data.name || '';
          editUnit.value = data.unit || '';
          editBalance.value = data.balance || 0;
          editAdjustment.value = '';
          editModal.classList.add('active');
        }
      }).catch(err => {
        console.error('Error fetching item for edit:', err);
        alert('Error loading item data');
      });
    }

    modalCancel.addEventListener('click', () => {
      editModal.classList.remove('active');
      currentEditingItem = null;
    });

    modalSave.addEventListener('click', async () => {
      if (!currentEditingItem) return;
      const newName = editName.value.trim();
      const newUnit = editUnit.value.trim();
      const newBalance = parseInt(editBalance.value || '0', 10) || 0;
      const adjustment = editAdjustment.value ? parseInt(editAdjustment.value, 10) : null;

      if (!newName) return alert('Name is required');

      try {
        const itemRef = doc(db, 'items', currentEditingItem);
        
        // Use transaction if adjustment is provided
        if (adjustment !== null) {
          await runTransaction(db, async (transaction) => {
            const docSnap = await transaction.get(itemRef);
            if (!docSnap.exists()) throw new Error('Item not found');
            
            const currentBalance = docSnap.data().balance || 0;
            const finalBalance = currentBalance + adjustment;
            
            if (finalBalance < 0) throw new Error('Resulting balance cannot be negative');
            
            transaction.update(itemRef, {
              name: newName,
              unit: newUnit,
              balance: finalBalance
            });

            // Create transaction record
            if (adjustment !== 0) {
              const txsCollection = collection(itemRef, 'transactions');
              const newTxRef = doc(txsCollection);
              transaction.set(newTxRef, {
                quantity: adjustment,
                type: adjustment > 0 ? 'in' : 'out',
                note: 'Adjustment via edit',
                createdAt: serverTimestamp(),
                user: currentUser ? currentUser.uid : null
              });
            }
          });
        } else {
          // Simple update without adjustment
          await updateDoc(itemRef, {
            name: newName,
            unit: newUnit,
            balance: newBalance
          });
        }

        console.log('Item updated successfully:', currentEditingItem);
        editModal.classList.remove('active');
        currentEditingItem = null;
      } catch (err) {
        console.error('Error updating item:', err);
        alert('Error: ' + (err.message || err));
      }
    });

    // Close modal on overlay click
    editModal.addEventListener('click', (e) => {
      if (e.target === editModal) {
        editModal.classList.remove('active');
        currentEditingItem = null;
      }
    });

    // Close history on overlay click
    historyPanel.addEventListener('click', (e) => {
      if (e.target === historyPanel) {
        historyPanel.classList.remove('active');
      }
    });

    refreshBtn.addEventListener('click', () => subscribeItems());
    searchInput.addEventListener('input', () => { /* rerender will be triggered by onSnapshot already; force quick refresh: */ subscribeItems(); });

    function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])); }

    // initial sample: (uncomment to create a sample item on first load)
