name: Set Firebase Admin Claim

on:
  workflow_dispatch:
    inputs:
      uid:
        description: 'Firebase user UID to grant admin claim'
        required: true

permissions:
  contents: read

jobs:
  set-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (target Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Show runtime info
        run: |
          echo "Runner: $(uname -a)"
          node --version
          npm --version

      - name: Write service account JSON from secret (safe heredoc)
        shell: bash
        run: |
          cat > ./service-account.json <<'JSON'
${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
JSON
          chmod 600 ./service-account.json
          echo "Wrote service-account.json (size: $(wc -c < ./service-account.json) bytes)"

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Run setAdmin script
        run: node scripts/setAdmin.js ./service-account.json ${{ github.event.inputs.uid }}

      - name: Clean up service account
        if: always()
        run: rm -f ./service-account.json
