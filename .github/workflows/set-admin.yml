name: Set Firebase Admin Claim

on:
  workflow_dispatch:
    inputs:
      uid:
        description: 'Firebase user UID to grant admin claim'
        required: true

permissions:
  contents: read

concurrency:
  group: set-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (target Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Show runtime info
        run: |
          echo "Runner: $(uname -a)"
          node --version
          npm --version

      - name: Write & validate service account JSON from secret
        shell: bash
        env:
          SA_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          # Write the secret to a temporary file using a heredoc.
          # IMPORTANT: the opening and closing 'JSON' markers below must be
          # indented exactly as shown (they belong to the run block).
          cat > ./service-account.json <<'JSON'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JSON
          chmod 600 ./service-account.json

          # Validate raw JSON
          if node -e "JSON.parse(require('fs').readFileSync('./service-account.json','utf8')); console.log('RAW JSON OK');" 2>/dev/null; then
            echo "Service account is valid JSON (raw)."
          else
            echo "Raw content is not valid JSON — attempting base64 decode..."
            if echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > ./service-account.json.decoded 2>/dev/null; then
              if node -e "JSON.parse(require('fs').readFileSync('./service-account.json.decoded','utf8')); console.log('DECODED JSON OK');" 2>/dev/null; then
                mv ./service-account.json.decoded ./service-account.json
                chmod 600 ./service-account.json
                echo "Service account written from base64-decoded secret."
              else
                echo "Base64 decoded content is not valid JSON." >&2
                rm -f ./service-account.json.decoded
                exit 1
              fi
            else
              echo "Base64 decode failed." >&2
              exit 1
            fi
          fi

          echo "service-account.json size: $(wc -c < ./service-account.json) bytes"

      - name: Install firebase-admin
        run: npm install firebase-admin --no-audit --no-fund

      - name: Run setAdmin script
        run: node scripts/setAdmin.js ./service-account.json ${{ github.event.inputs.uid }}

      - name: Clean up service account
        if: always()
        run: |
          rm -f ./service-account.json
          rm -f ./service-account.json.decoded || true
